# Build e implantação contínua no Cloud Run (usado pelo gatilho do Cloud Build).
# O nome da imagem é fixo: o nome do repositório no GitHub termina em "-",
# o que gera uma referência de imagem inválida na configuração automática do Cloud Run.
substitutions:
  _REGION: us-central1
  _SERVICE: admissibilidade-1vp
  _AR_REPO: cloud-run-source-deploy

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA', '.']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA']

  # Só troca a imagem: variáveis, segredos e demais ajustes do serviço são mantidos.
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
