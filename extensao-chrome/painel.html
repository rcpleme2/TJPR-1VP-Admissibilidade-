<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admissibilidade</title>
    <link rel="stylesheet" href="estilo.css" />
    <style>
      body { overflow: hidden; }
      #app { display: block; width: 100%; height: 100%; border: 0; background: var(--papel); }
      #configurar { padding: 24px 16px; }
      #configurar > p { color: var(--tinta-2); margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <section id="configurar" hidden>
      <h1>Admissibilidade</h1>
      <p>Informe o endereço do sistema para abri-lo aqui no painel.</p>
      <div id="form"></div>
    </section>
    <iframe id="app" title="Sistema de admissibilidade" allow="clipboard-write" hidden></iframe>
    <script type="module" src="painel.js"></script>
  </body>
</html>
