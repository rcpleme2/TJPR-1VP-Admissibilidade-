<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admissibilidade</title>
    <link rel="stylesheet" href="estilo.css" />
    <style>
      body { overflow: hidden; }
      #app { display: block; width: 100%; height: 100%; border: 0; background: var(--papel); }
      #carregando { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--papel); transition: opacity .2s; }
      #carregando[hidden] { display: none; }
      #carregando .marca { font: 600 22px/1.2 Georgia, "Times New Roman", serif; color: var(--toga); }
      #carregando .barra { width: 120px; height: 2px; background: var(--linha); overflow: hidden; border-radius: 2px; }
      #carregando .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--toga); animation: ir 1.1s ease-in-out infinite; }
      #carregando p { font-size: 13px; color: var(--tinta-3); }
      @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #carregando .barra::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="carregando" role="status">
      <span class="marca">Admissibilidade</span>
      <span class="barra" aria-hidden="true"></span>
      <p>Abrindo o sistema…</p>
    </div>
    <iframe id="app" title="Sistema de admissibilidade" allow="clipboard-write"></iframe>
    <script type="module" src="painel.js"></script>
  </body>
</html>
